<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;}
  .wrap{width:128px;height:128px;position:relative;}
  .sq{position:absolute;inset:4px;border-radius:28px;
    background:linear-gradient(135deg,#0f1f3d 0%,#1b3a6b 55%,#0ea5a0 130%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -2px 6px rgba(0,0,0,.35);}
  .gloss{position:absolute;inset:4px;border-radius:28px;
    background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 45%);}
  svg{position:absolute;inset:0;}
</style>
<div class="wrap">
  <div class="sq"></div>
  <div class="gloss"></div>
  <svg viewBox="0 0 128 128">
    <!-- clipboard hint -->
    <rect x="38" y="30" width="52" height="68" rx="8" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="5"/>
    <rect x="52" y="24" width="24" height="12" rx="5" fill="rgba(255,255,255,.35)"/>
    <!-- check -->
    <path d="M 44 66 L 60 84 L 92 48" fill="none" stroke="#0b1226" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>
    <path d="M 44 66 L 60 84 L 92 48" fill="none" stroke="#4ade80" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>
