<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;}
  .stage{width:440px;height:280px;overflow:hidden;position:relative;
    background:
      radial-gradient(400px 300px at 85% 15%, rgba(14,165,160,.30), transparent 60%),
      linear-gradient(120deg,#0b1730,#0f1f3d 55%,#123049);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  .mark{width:76px;height:76px;border-radius:19px;position:relative;
    background:linear-gradient(135deg,#152a52,#1b3a6b 55%,#0ea5a0 130%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 10px 26px rgba(0,0,0,.4);}
  .mark svg{position:absolute;inset:0;}
  .name{font-size:30px;font-weight:900;letter-spacing:-.4px;}
  .name em{font-style:normal;color:#5eead4;}
  .tag{font-size:14.5px;color:#c7d4e8;}
</style>
<div class="stage">
  <div class="mark">
    <svg viewBox="0 0 76 76">
      <path d="M 22 39 L 33 51 L 55 27" fill="none" stroke="#0b1226" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>
      <path d="M 22 39 L 33 51 L 55 27" fill="none" stroke="#4ade80" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="name">SA <em>Auditor</em></div>
  <div class="tag">Your pending ROs, audited — inside Tekmetric</div>
</div>
